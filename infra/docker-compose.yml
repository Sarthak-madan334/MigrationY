services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: migration_rehearsal
      POSTGRES_USER: rehearsal
      POSTGRES_PASSWORD: rehearsal
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehearsal -d migration_rehearsal"]
      interval: 2s
      timeout: 3s
      retries: 20